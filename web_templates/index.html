<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>generate-ppt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="head">
          <span class="eyebrow">PPT TEMPLATE SERVICE</span>
          <h1>技术文档转 PPT</h1>
          <p>上传技术文档，选择模板，生成适合录屏讲解的 16:9 PPT。</p>
        </div>

        <form id="generate-form">
          <label class="field">
            <span>选择模板</span>
            <select name="template_id">
              {% for template in templates %}
              <option value="{{ template.id }}">{{ template.name }}</option>
              {% endfor %}
            </select>
          </label>

          <div class="templates">
            {% for template in templates %}
            <article class="template-card">
              <strong>{{ template.name }}</strong>
              <small>{{ template.description }}</small>
            </article>
            {% endfor %}
          </div>

          <label class="drop">
            <input id="document" name="document" type="file" accept=".pdf,.docx,.md,.markdown,.txt" required>
            <span id="file-label">点击选择 PDF / Word / Markdown / TXT</span>
          </label>

          <button id="submit" type="submit">生成 PPT</button>
        </form>

        <div id="status" class="status"></div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#generate-form");
      const statusBox = document.querySelector("#status");
      const fileInput = document.querySelector("#document");
      const fileLabel = document.querySelector("#file-label");
      const submit = document.querySelector("#submit");

      fileInput.addEventListener("change", () => {
        fileLabel.textContent = fileInput.files[0]?.name || "点击选择 PDF / Word / Markdown / TXT";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusBox.textContent = "正在生成，请稍等...";
        statusBox.className = "status active";
        submit.disabled = true;

        try {
          const response = await fetch("{{ url_for('api_generate') }}", {
            method: "POST",
            body: new FormData(form)
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "生成失败");
          statusBox.innerHTML = `生成完成：<a href="${payload.download_url}">${payload.filename}</a>`;
          statusBox.className = "status success";
        } catch (error) {
          statusBox.textContent = error.message;
          statusBox.className = "status error";
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
